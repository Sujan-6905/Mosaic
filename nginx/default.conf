# Round-robins backend replicas for docker-compose.scale.yml.

# A variable in proxy_pass re-resolves `backend` per request; Docker's DNS rotates
# replica order, which round-robins. A static upstream would pin one replica forever.
resolver 127.0.0.11 valid=5s;

# Only a WebSocket handshake asks to upgrade; every other request keeps its connection reusable.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;

    # The largest body the backend accepts, a piece set file.
    client_max_body_size 2m;

    location / {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;

        # Fails fast on a replica that just died so the client reconnects elsewhere.
        proxy_connect_timeout 3s;
        # An assistant turn or an agent edit can run for up to two minutes.
        proxy_read_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
