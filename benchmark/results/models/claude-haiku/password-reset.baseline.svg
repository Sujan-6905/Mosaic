oke="#1f2937" stroke-width="2" fill="none" opacity="1" marker-end="url(#arrow)"/><line x1="600" y1="570" x2="600" y2="600" stroke="#1f2937" stroke-width="2" fill="none" opacity="1" marker-end="url(#arrow)"/><line x1="600" y1="650" x2="600" y2="700" stroke="#1f2937" stroke-width="2" fill="none" opacity="1" marker-end="url(#arrow)"/></svg>