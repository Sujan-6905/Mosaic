<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 -20 786 810" width="786" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect x="60" y="-20" width="786" height="810" fill="#f6f6f3"/><ellipse cx="600" cy="45" rx="120" ry="25" stroke="#1f2937" stroke-width="2" fill="none" opacity="1"/><text x="600" y="49.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">Start: reset requested</text><rect x="480" y="100" width="240" height="50" stroke="#1f2937" stroke-width="2" fill="none" opacity="1"/><text x="600" y="129.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">Enter email address</text><rect x="450" y="180" width="300" height="50" stroke="#1f2937" stroke-width="2" fill="none" opacity="1"/><text x="600" y="209.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">Create token and email reset link</text><ellipse cx="600" cy="285" rx="120" ry="25" stroke="#1f2937" stroke-width="2" fill="none" opacity="1"/><text x="600" y="289.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">User clicks link</text><rect x="480" y="340" width="240" height="50" stroke="#1f2937" stroke-width="2" fill="none" opacity="1"/><text x="600" y="369.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">Check token</text><rect x="450" y="420" width="300" height="50" stroke="#1f2937" stroke-width="2" fill="none" opacity="1"/><text x="600" y="449.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">Token valid and unexpired?</text><rect x="100" y="420" width="260" height="50" stroke="#1f2937" stroke-width="2" fill="none" opacity="1"/><text x="230" y="449.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">Show invalid or expired error</text><ellipse cx="230" cy="5